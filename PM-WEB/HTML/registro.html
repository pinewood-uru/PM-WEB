<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Asesoramiento completo contra Incendio, permisos en Bomberos y extintores">
    <meta name="keywords" content="Bomberos, extintores, Habilitación, incendio">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Language" content="es">
    <meta http-equiv="cache-control" content="no-cache">

    <title>PM - Contra Incendio</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <main class="d-flex flex-column gap-2 justify-content-center min-vh-100  m-0">

      <h1>Bienvenido a PM</h1>
 
        <div class="col-md-7 col-lg-8 p-2 shadowpm rounded bg-dark mx-3 gap-2">
            <h4 class="mb-3 text-white fw-bold pt-2">Registro</h4>
            <form class="needs-validation pt-1" novalidate="">
                <div class="row g-3">
                    
                    <div class="col-sm-6 align-items-start d-flex flex-column">
                        <label for="nombre" class="form-label text-white fw-bold">Nombre</label>
                        <input type="text" class="form-control " id="form-register-nombre" placeholder="Juan" value="" required="">
                        <div class="invalid-feedback">
                            Nombre es requerido
                        </div>
                    </div>

                    <div class="col-sm-6 align-items-start d-flex flex-column">
                        <label for="apellido" class="form-label text-white fw-bold">Apellido</label>
                        <input type="text" class="form-control " id="form-register-apellido" placeholder="Perez" value="" required="">
                        <div class="invalid-feedback">
                            Apellido es requerido
                        </div>
                    </div>


                    <div class="col-12 align-items-start d-flex flex-column">
                        <label for="email" class="form-label text-white fw-bold">Email</label>
                        <input type="email" class="form-control" id="form-register-email" placeholder="juan@perez.com">
                        <div class="invalid-feedback">
                            Email es requerido
                        </div>
                    </div>

                    <div class="col-12 align-items-start d-flex flex-column text-white fw-bold">
                        <label for="form-register-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="form-register-password">
                      </div>
                </div>

                <button class="w-75 btn btn-danger btn-md mt-4" type="submit">Continuar</button>
            </form>

            <p class="my-2 text-white">Ya tienes cuenta? <a href="login.html" class="text-white">Iniciar Sesión</a></p>
        </div>
    </main>
    <footer class="sticky-bottom d-flex flex-wrap justify-content-between align-items-center py-3 px-2 mt-2 bg-danger">
        <p class="col-md-4 mb-0 text-white">© 2024 PM Contra Incendio</p>

        <a href="index.html"
            class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-dark text-decoration-none bg-white rounded py-1">
            <img src="/img/PMfinal.png" class="logonav" alt="logo">
        </a>
    </footer>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous" type="module"></script>
    <script src="../js/register.js" type="module"></script>
</html>
