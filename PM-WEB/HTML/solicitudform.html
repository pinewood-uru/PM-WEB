  <body>

        <a class="navbar-brand rounded bg-white" href="#"
          ><img src="/img/PMfinal.png" class="logonav" alt="logo"
        /></a>
        <button
          class="navbar-toggler bg-white"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- OFF CANVAS -->

        <div
          class="offcanvas offcanvas-end bg bg-white"
          tabindex="-1"
          id="offcanvasNavbar"
          aria-labelledby="offcanvasNavbarLabel"
        >
          <div class="offcanvas-header">
            <h3 class="offcanvas-title" id="offcanvasNavbarLabel">
              PM - Contra incendio
            </h3>
            <button
              type="button"
              class="btn-close btn-danger"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item d-flex no-wrap gap-2">
                <button type="button" class="btn btn-danger">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-person"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"
                    ></path>
                  </svg>
                </button>
                <a class="nav-link" href="login.html"
                  >Iniciar Sesión / Registro</a

              </li>
              <li class="nav-item">

                  >Home</a
                >

              <li class="nav-item">
                <a class="nav-link" href="buscarproyecto.html">
                  Buscar Proyecto</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main class="d-flex flex-column gap-2 justify-content-start min-vh-100">
      <div class="col-md-7 col-lg-8 px-2">
        <div id="form-proyecto-error"></div>
        <h4 class="mb-3 text-dark fw-bold pt-2">Solicitud de Proyecto</h4>
        <form class="needs-validation pt-1" novalidate="">
          <div class="row g-3">
            <div class="col-12 align-items-start d-flex flex-column">
              <label for="razonsocial" class="form-label text-danger fw-bold"
                >Razón Social</label
              >
              <div class="input-group has-validation">
                <input
                  type="text"
                  class="form-control"
                  id="razonsocial"
                  placeholder="Razón social"
                  required=""
                />
                <div class="invalid-feedback">Razón social es requerido</div>
              </div>
            </div>

            <div class="col-md-3 align-items-start d-flex flex-column">
              <label for="rut" class="form-label text-danger fw-bold"
                >RUT</label
              >
              <input
                type="text"
                class="form-control"
                id="rut"
                placeholder=""
                required=""
              />
              <div class="invalid-feedback">Número de Rut es requerido</div>
            </div>

            <div class="col-12 align-items-start d-flex flex-column">
              <label for="direccion" class="form-label text-danger fw-bold"
                >Dirección</label
              >
              <input
                type="text"
                class="form-control"
                id="direccion"
                placeholder="18 de Julio 1234"
                required=""
              />
              <div class="invalid-feedback">Dirección es requrida</div>
            </div>

            <div class="col-12 align-items-start d-flex flex-column">
              <label for="padron" class="form-label text-danger fw-bold"
                >Padrón</label
              >
              <input
                type="text"
                class="form-control"
                id="padron"
                placeholder="1234"
                required=""
              />
              <div class="invalid-feedback">Ingresar padrón</div>
            </div>
          </div>

          <button
            class="w-75 btn btn-dark btn-md my-3"
            type="button"
            id="form-proyecto-submit"
            value="form-proyecto-submit"
          >
            Continuar
          </button>
        </form>
      </div>
    </main>
    <footer
      class="sticky-sm-bottom d-flex flex-wrap justify-content-between align-items-center py-3 px-2 mt-2 bg-danger"
    >
      <p class="col-md-4 mb-0 text-white">© 2024 PM Contra Incendio</p>

      <a
        href="index.html"
        class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-dark text-decoration-none bg-white rounded py-1"
      >
        <img src="/img/PMfinal.png" class="logonav" alt="logo" />
      </a>
    </footer>
    <script src="../js/formproyecto.js" type="module"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
  </body>
